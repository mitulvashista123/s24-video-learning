# S24 Online Video Learning – workloads managed by ArgoCD (GitOps). Never `kubectl apply` these.
#
#   Service 1 user-service          Deployment  (REST, RDS PostgreSQL)
#   Service 2 catalog-service       Deployment  (REST, RDS PostgreSQL, Kafka producer)
#   Service 3 metadata-service      Deployment  (REST, RDS PostgreSQL + S3, Kafka producer)
#   Service 4 content-delivery-api  Deployment  (public REST via Ingress, gRPC client, Kafka producer) – HPA
#   Service 5 cache-manager         StatefulSet (gRPC + REST, consistent-hash partitions, Kafka consumer)
#   Service 6 progress-tracker      Deployment  (REST, DynamoDB, Kafka producer) – HPA
#   Service 7 recommendation-fn     AWS Lambda  (provisioned by Terraform: S3 + MSK triggers)
#   Service 8 usage-analytics-flink Amazon EMR  (provisioned by Terraform: PyFlink job on YARN)
#
# Images are written as s24/<service>; the kustomize overlay (k8s-apps/overlays/aws) maps them
# to the ECR repositories and pins the tag that CI / scripts/build-and-push.sh committed.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels: {app: user-service, app.kubernetes.io/part-of: s24-video-learning}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: user-service}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: user-service, app.kubernetes.io/part-of: s24-video-learning}
    spec:
      serviceAccountName: s24-app
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: user-service}
      containers:
        - name: user-service
          image: s24/user-service
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: SERVICE_NAME, value: user-service}
            - {name: LOG_LEVEL, value: INFO}
          envFrom:
            - configMapRef: {name: s24-config}
            - secretRef: {name: s24-db}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  labels: {app: user-service, app.kubernetes.io/part-of: s24-video-learning, s24/metrics: "true"}
spec:
  type: ClusterIP
  selector: {app: user-service}
  ports:
    - {name: http, port: 80, targetPort: http}
