# Service 5 – Cache Manager. A StatefulSet gives every replica a stable identity
# (cache-manager-0..2) that is used as its physical node name on the consistent-hash ring.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache-manager
  labels: {app: cache-manager, app.kubernetes.io/part-of: s24-video-learning}
spec:
  serviceName: cache-manager-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: cache-manager}
  template:
    metadata:
      labels: {app: cache-manager, app.kubernetes.io/part-of: s24-video-learning}
    spec:
      serviceAccountName: s24-app
      terminationGracePeriodSeconds: 20
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: cache-manager}
      containers:
        - name: cache-manager
          image: s24/cache-manager
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8000}
            - {name: grpc, containerPort: 50051}
          env:
            - {name: SERVICE_NAME, value: cache-manager}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: STATEFULSET_NAME, value: cache-manager}
            - {name: HEADLESS_SERVICE, value: cache-manager-headless}
            - {name: CACHE_REPLICAS, value: "3"}
            - {name: VIRTUAL_NODES, value: "160"}
            - {name: DEFAULT_TTL_SECONDS, value: "300"}
            - {name: MAX_TTL_SECONDS, value: "3600"}
            - {name: MAX_ENTRIES, value: "50000"}
            - {name: TOMBSTONE_MS, value: "10000"}
            - {name: SWEEP_INTERVAL_SECONDS, value: "15"}
            - {name: GRPC_PORT, value: "50051"}
          envFrom:
            - configMapRef: {name: s24-config}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
# Headless service: stable per-pod DNS (cache-manager-N.cache-manager-headless.s24.svc...)
# used for ring membership, peer forwarding and client-side round-robin gRPC.
apiVersion: v1
kind: Service
metadata:
  name: cache-manager-headless
  labels: {app: cache-manager, app.kubernetes.io/part-of: s24-video-learning}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: cache-manager}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc}
    - {name: http, port: 8000, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: cache-manager
  labels: {app: cache-manager, app.kubernetes.io/part-of: s24-video-learning, s24/metrics: "true"}
spec:
  type: ClusterIP
  selector: {app: cache-manager}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: grpc, port: 50051, targetPort: grpc}
