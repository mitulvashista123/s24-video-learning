# Public entry point: ingress-nginx (installed by Terraform behind an AWS NLB)
# routes every Internet request to the Content Delivery API only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s24-public
  labels: {app: content-delivery-api, app.kubernetes.io/part-of: s24-video-learning}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type,X-User-Id,X-Request-Id"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: content-delivery-api
                port:
                  name: http
