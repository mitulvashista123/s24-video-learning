apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace-scoped objects default to the ArgoCD destination namespace (s24).
# The namespace, IRSA service account `s24-app`, ConfigMap `s24-config` and
# Secret `s24-db` are created by Terraform because they carry cloud outputs.
resources:
  - deployments.yaml
  - hpa.yaml
  - ingress.yaml
  - servicemonitor.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: s24-grafana-dashboard
    namespace: monitoring
    files:
      - dashboards/s24-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
